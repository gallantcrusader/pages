  <div id="event-banner" class="event-banner" role="region" aria-label="Featured event" hidden></div>

  <main id="view" tabindex="-1">
    <noscript>
      <section class="card">
        <h1>StormCheck needs JavaScript</h1>
        <p>Turn on JavaScript to see live alerts for your ZIP. In an emergency call 911. For shelters text SHELTER and your ZIP to 43362. FEMA: 1-800-621-3362.</p>
      </section>
    </noscript>
  </main>

  <footer class="footer">
    <p>Not an official source — follow local officials. In an emergency, call 911.</p>
    <p><a href="#/about">About, privacy &amp; data sources</a></p>
  </footer>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>Home</span>
    </a>
    <a href="#/live" data-tab="live">

  <dialog id="loc-dialog" aria-label="Choose a location">
    <div class="dialog-body"></div>
    <button type="button" class="icon-btn dialog-close" data-action="close-dialog" aria-label="Close">×</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
